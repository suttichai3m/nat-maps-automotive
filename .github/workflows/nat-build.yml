name: NAT V3.1 integrated candidate build
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Signed SOC unit tests
        run: bash scripts/test-signed-soc.sh
      - name: Navigation summary tests
        run: bash scripts/test-navigation-summary.sh
      - name: Theme schedule tests
        run: bash scripts/test-theme-schedule.sh
      - name: Battery frame placement tests
        run: bash scripts/test-battery-placement.sh
      - name: Integrated battery tests
        run: bash scripts/test-integrated-battery.sh
      - name: V3.3 daily energy tests
        run: bash scripts/test-nat-v33.sh
      - name: V3.4 Smart EV math tests
        run: bash scripts/test-nat-v34.sh
      - name: Build patch
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: |
          bash gradlew --no-daemon :patches:generatePatchesList
          bash gradlew --no-daemon buildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: NAT-V3.1-integrated-candidate-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error
