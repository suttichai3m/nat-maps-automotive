name: NAT V3.1-alpha1 integrated patch build

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Signed SOC unit tests
        run: bash scripts/test-signed-soc.sh

      - name: Build patch
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: |
          bash gradlew --no-daemon :patches:generatePatchesList
          bash gradlew --no-daemon buildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: NAT-V3.1-alpha1-integrated-mpp
          path: patches/build/libs/*.mpp
          if-no-files-found: error