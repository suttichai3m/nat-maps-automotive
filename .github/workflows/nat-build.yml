name: NAT V3.0 Smart Split Screen build
on:
  workflow_dispatch:
  push:
    branches:
      - nat-split-screen
permissions:
  contents: read
  packages: read
jobs:
  build:
    if: github.ref == 'refs/heads/nat-split-screen'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify branch and commit
        run: |
          test "$GITHUB_REF" = refs/heads/nat-split-screen
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --oneline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Signed SOC unit tests
        run: bash scripts/test-signed-soc.sh
      - name: Navigation summary tests
        run: bash scripts/test-navigation-summary.sh
      - name: Theme schedule tests
        run: bash scripts/test-theme-schedule.sh
      - name: Battery frame placement tests
        run: bash scripts/test-battery-placement.sh
      - name: Integrated battery tests
        run: bash scripts/test-integrated-battery.sh
      - name: Build patch
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.MORPHE_PACKAGES_TOKEN || github.token }}
        run: |
          bash gradlew --no-daemon :patches:generatePatchesList
          bash gradlew --no-daemon buildAndroid
      - uses: actions/upload-artifact@v4
        with:
          name: NAT-V3.0-smart-split-screen-mpp-${{ github.run_number }}
          path: patches/build/libs/*.mpp
          if-no-files-found: error
